<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: iPhone 노치·홈 막대 영역(env(safe-area-inset-*))을 CSS에서 직접 비켜 가도록 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>VN Studio</title>
  <!-- 휴대폰 홈 화면 앱(원격 접속용): 매니페스트·아이콘. 서비스 워커는 쓰지 않는다 -->
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VN Studio">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='-apple-system,Helvetica,Arial' font-size='26' font-weight='800' text-anchor='middle' fill='white'%3EVN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/remote.css">
  <link rel="stylesheet" href="/static/css/secret.css">
  <!-- 휴대폰·태블릿 화면 (1023px 이하·터치). 데스크톱(1024px 이상) 레이아웃은 바꾸지 않는다 -->
  <link rel="stylesheet" href="/static/css/mobile.css">
  <script>
    // 첫 화면 깜빡임 방지: 저장된 테마를 먼저 적용
    try {
      var t = JSON.parse(localStorage.getItem('vn.theme') || '"auto"');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* 무시 */ }
  </script>
  <!-- 3D 뷰어(프롬프트 추출 탭)용 라이브러리 이름. 모듈 스크립트보다 앞에 있어야 한다. 실제 로드는 3D 모드를 처음 열 때 -->
  <script type="importmap">
    {"imports": {"three": "/static/vendor/three/build/three.module.js", "three/addons/": "/static/vendor/three/examples/jsm/", "@pixiv/three-vrm": "/static/vendor/three-vrm/three-vrm.module.js"}}
  </script>
  <script type="module" src="/static/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="topbar" id="topbar">
    <div class="topbar-row">
      <a class="brand" href="#/generate" aria-label="VN Studio — 생성 화면으로">
        <span class="brand-mark" aria-hidden="true">VN</span>
        <span class="brand-name">VN Studio</span>
      </a>

      <div class="engine" id="engine">
        <span class="engine-badge is-unknown" id="engine-badge" role="status" aria-live="polite">
          <span class="engine-dot" id="engine-dot" aria-hidden="true">◌</span>
          <span class="engine-text" id="engine-text">상태 확인 중…</span>
          <span class="engine-short" id="engine-short" aria-hidden="true">확인 중</span>
        </span>
        <button type="button" class="btn btn-sm btn-primary" id="engine-start" hidden>시작</button>
        <button type="button" class="btn btn-sm btn-ghost" id="engine-stop" hidden>중지</button>
        <button type="button" class="btn btn-sm btn-ghost" id="engine-restart" hidden>재시작</button>
      </div>

      <a class="topbar-job" id="current-job" href="#/jobs" hidden>
        <span class="topbar-job-text" id="current-job-text"></span>
        <span class="mini-progress" aria-hidden="true"><span class="mini-progress-bar" id="current-job-bar"></span></span>
      </a>

      <span class="topbar-spacer"></span>

      <button type="button" class="secret-toggle" id="secret-toggle" aria-pressed="false">
        <svg class="secret-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18M6 10l1.6-5h8.8L18 10"/><circle cx="7.5" cy="16" r="3"/><circle cx="16.5" cy="16" r="3"/><path d="M10.5 16h3"/></svg>
        <span class="secret-toggle-text" id="secret-toggle-text">시크릿</span>
      </button>
      <a class="remote-badge" id="remote-badge" href="#/models/settings/remote" hidden>
        <span class="remote-badge-dot" aria-hidden="true"></span>
        <span class="remote-badge-text" id="remote-badge-text">원격</span>
      </a>
      <button type="button" class="pill pill-info" id="dl-pill" hidden></button>
      <a class="pill" id="queue-count" href="#/jobs" hidden></a>
      <span class="sse-indicator is-connecting" id="sse-indicator" role="status">
        <span class="sse-dot" aria-hidden="true"></span>
        <span class="sse-text" id="sse-text">연결 중</span>
      </span>
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="테마 바꾸기">◐</button>
      <button type="button" class="icon-btn" id="app-menu" aria-label="메뉴 열기" aria-haspopup="menu" aria-expanded="false">⋯</button>
    </div>

    <!-- 데스크톱: 상단 탭. 휴대폰(760px 이하): 화면 아래에 고정된 탭 바(아이콘 + 짧은 글자) — mobile.css -->
    <nav class="tabs" id="tabs" aria-label="주 메뉴">
      <a class="tab" href="#/generate" data-view="generate"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 4.6 4.6 1.9-4.6 1.9L12 16.5l-1.9-4.6L5.5 10l4.6-1.9z"/><path d="M18.5 15.5l.8 1.9 1.9.8-1.9.8-.8 1.9-.8-1.9-1.9-.8 1.9-.8z"/></svg><span class="tab-label">생성</span></a>
      <a class="tab" href="#/characters" data-view="characters"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.8 3.6-5.8 7.5-5.8s6.9 2 7.5 5.8"/></svg><span class="tab-label">캐릭터</span></a>
      <a class="tab" href="#/backgrounds" data-view="backgrounds"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 16.5l5-5 4 4 3-3 5 5"/><circle cx="15.5" cy="9.5" r="1.5"/></svg><span class="tab-label">배경</span></a>
      <a class="tab" href="#/sheet" data-view="sheet"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M9 4v16M15 4v16"/></svg><span class="tab-label">스프라이트 시트</span><span class="tab-short">시트</span></a>
      <a class="tab" href="#/pixel" data-view="pixel"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h4v4H5zM10 10h4v4h-4zM15 15h4v4h-4zM15 5h4v4h-4zM5 15h4v4H5z"/></svg><span class="tab-label">도트</span></a>
      <a class="tab" href="#/icons" data-view="icons"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="M12 7.5l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z"/></svg><span class="tab-label">아이콘</span></a>
      <a class="tab" href="#/extract" data-view="extract"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.6V4.5a1 1 0 0 1 1-1h7.1l9 9-8.1 8.1z"/><circle cx="8" cy="8" r="1.6"/></svg><span class="tab-label">프롬프트 추출</span><span class="tab-short">추출</span></a>
      <a class="tab" href="#/gallery" data-view="gallery"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg><span class="tab-label">갤러리</span></a>
      <a class="tab" href="#/jobs" data-view="jobs"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11.5M9 12h11.5M9 17.5h11.5"/><circle cx="4.8" cy="6.5" r="1.3" fill="currentColor"/><circle cx="4.8" cy="12" r="1.3" fill="currentColor"/><circle cx="4.8" cy="17.5" r="1.3" fill="currentColor"/></svg><span class="tab-label">작업</span><span class="tab-badge" id="tab-badge-jobs" hidden></span></a>
      <a class="tab" href="#/models" data-view="models"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l8.5 4.6L12 12.7 3.5 8.1z"/><path d="M3.5 12.2l8.5 4.6 8.5-4.6M3.5 16.2l8.5 4.6 8.5-4.6"/></svg><span class="tab-label">모델·LoRA</span><span class="tab-short">모델</span></a>
      <a class="tab" href="#/help" data-view="help"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.2c-.8.4-1.2 1-1.2 1.8v.4"/><circle cx="12" cy="16.9" r=".6" fill="currentColor"/></svg><span class="tab-label">도움말</span></a>
    </nav>

    <div class="global-progress" id="global-progress" hidden>
      <div class="global-progress-bar" id="global-progress-bar"></div>
    </div>
  </header>

  <div class="banner banner-secret" id="secret-banner" role="status" hidden>
    <span class="banner-icon" aria-hidden="true">●</span>
    <span class="banner-text"><strong>시크릿 모드</strong> — 지금 만드는 작업·그림은 시크릿 모드를 끄거나 VN Studio를 종료하면 삭제됩니다. 남길 그림은 먼저 다운로드하세요.</span>
    <span class="banner-actions">
      <button type="button" class="btn btn-sm btn-ghost" id="secret-banner-off">끄고 삭제</button>
    </span>
  </div>

  <div class="banner banner-warn" id="engine-banner" role="status" hidden>
    <span class="banner-icon" aria-hidden="true">!</span>
    <span class="banner-text" id="banner-text"></span>
    <span class="banner-actions">
      <button type="button" class="btn btn-sm btn-primary" id="banner-start">엔진 시작</button>
      <button type="button" class="btn btn-sm btn-ghost" id="banner-log">로그 보기</button>
    </span>
  </div>

  <main class="views" id="main" tabindex="-1">
    <section class="view" id="view-generate" data-view="generate" aria-label="생성" hidden></section>
    <section class="view" id="view-characters" data-view="characters" aria-label="캐릭터" hidden></section>
    <section class="view" id="view-backgrounds" data-view="backgrounds" aria-label="배경" hidden></section>
    <section class="view" id="view-sheet" data-view="sheet" aria-label="스프라이트 시트" hidden></section>
    <section class="view" id="view-pixel" data-view="pixel" aria-label="도트" hidden></section>
    <section class="view" id="view-icons" data-view="icons" aria-label="아이콘" hidden></section>
    <section class="view" id="view-extract" data-view="extract" aria-label="프롬프트 추출" hidden></section>
    <section class="view" id="view-gallery" data-view="gallery" aria-label="갤러리" hidden></section>
    <section class="view" id="view-jobs" data-view="jobs" aria-label="작업" hidden></section>
    <section class="view" id="view-models" data-view="models" aria-label="모델·LoRA" hidden></section>
    <section class="view" id="view-help" data-view="help" aria-label="도움말" hidden></section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div id="modal-root"></div>
  <div class="lightbox" id="lightbox" hidden></div>

  <noscript>
    <div class="noscript">VN Studio를 사용하려면 브라우저에서 JavaScript를 켜 주세요.</div>
  </noscript>
</body>
</html>
